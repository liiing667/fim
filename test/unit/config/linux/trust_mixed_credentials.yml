node: "FIM"

events:
  destination: network
  endpoint:
    address: https://fim.example.test
    credentials:
      token: super-secret-token
      user: test_user
      password: super-secret-password

monitor:
  - path: /tmp

hashscanner:
  file: /var/lib/fim/fim.db

log:
  file: /var/log/fim/fim.log
  level: info
